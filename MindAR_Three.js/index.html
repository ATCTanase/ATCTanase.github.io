<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MindAR Standing Image Example</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.4/dist/mindar-image-three.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script>
  // MindAR初期化
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.body,
    imageTargetSrc: './targets.mind',
  });
  const { renderer, scene, camera } = mindarThree;

  // ==============================
  // 設定部分
  // ==============================
  const folderPath = './AR1/';
  const frameBaseName = 'kominka_AR1';
  const frameExt = '.png';
  const frameCount = 48;
  const frameRate = 6;

  // ==============================
  // 画像読み込み
  // ==============================
  const loader = new THREE.TextureLoader();
  const textures = [];
  for (let i = 0; i <= frameCount; i++) {
    textures.push(loader.load(`${folderPath}${frameBaseName}${i}${frameExt}`));
  }

  // 🎞 平面メッシュを作成
  const geometry = new THREE.PlaneGeometry(1, 1);
  const material = new THREE.MeshBasicMaterial({
    map: textures[0],
    transparent: true,
    side: THREE.DoubleSide,
  });
  const plane = new THREE.Mesh(geometry, material);

  // ✅ 平面を「垂直に立てる」
  // MindARのマーカー面はXY平面にあるので、
  // 垂直にしたい場合はX軸に -90° 回転
  plane.rotation.x = -Math.PI / 2;

  // ✅ 少し浮かせて「マーカーの上に立つ」ように
  plane.position.y = 0.5; // マーカーから上方向に0.5単位浮かせる

  // Anchorに追加
  const anchor = mindarThree.addAnchor(0);
  anchor.group.add(plane);

  // ライト
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // ==============================
  // アニメーション設定
  // ==============================
  let frameIndex = 0;
  let lastTime = 0;
  const animateFrames = (time) => {
    const delta = time - lastTime;
    if (delta > 1000 / frameRate) {
      frameIndex = (frameIndex + 1) % textures.length;
      material.map = textures[frameIndex];
      lastTime = time;
    }
  };

  // ==============================
  // マーカー追従ON/OFF制御
  // ==============================
  let isMarkerVisible = false;
  let lastMatrix = new THREE.Matrix4();

  anchor.onTargetFound = () => {
    isMarkerVisible = true;
  };

  anchor.onTargetLost = () => {
    isMarkerVisible = false;
    lastMatrix.copy(anchor.group.matrixWorld);
  };

  // ==============================
  // 毎フレーム更新
  // ==============================
  const animate = (time) => {
    animateFrames(time);

    if (!isMarkerVisible) {
      // マーカー見失い → 固定
      plane.matrixAutoUpdate = false;
      plane.matrix.copy(lastMatrix);
    } else {
      // 検出中 → MindAR制御
      plane.matrixAutoUpdate = true;
    }

    renderer.render(scene, camera);
  };

  // ==============================
  // 開始
  // ==============================
  const start = async () => {
    await mindarThree.start();
    renderer.setAnimationLoop(animate);
  };
  start();
</script>
</body>
</html>
