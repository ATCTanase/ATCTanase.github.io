<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR.js + WebXR Hybrid</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black; }
  #ar-canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<canvas id="ar-canvas"></canvas>

<!-- Three.js + AR.js（THREEx） -->
<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex.min.js"></script>

<script>
window.detectedMatrix = null;

function initMarker() {
  const scene = new THREE.Scene();
  const camera = new THREE.Camera();
  scene.add(camera);

  const renderer = new THREE.WebGLRenderer({ alpha:true, canvas: document.getElementById('ar-canvas') });
  renderer.setSize(window.innerWidth, window.innerHeight);

  const arSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
  const arContext = new THREEx.ArToolkitContext({
    cameraParametersUrl: 'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/data/camera_para.dat',
    detectionMode: 'mono'
  });

  arSource.init(() => onResize());
  window.addEventListener('resize', onResize);

  const markerRoot = new THREE.Group();
  scene.add(markerRoot);

  new THREEx.ArMarkerControls(arContext, markerRoot, {
    type: 'pattern',
    patternUrl: '/pattern-AR1.patt' // ← ここを指定
  });

  function onResize() {
    if(arSource) arSource.onResizeElement();
    if(arSource) arSource.copyElementSizeTo(renderer.domElement);
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function renderLoop(){
    requestAnimationFrame(renderLoop);
    if(arSource.ready) arContext.update(arSource.domElement);
    renderer.render(scene, camera);

    if(markerRoot.visible){
      window.detectedMatrix = markerRoot.matrixWorld.clone();
      console.log('✅ マーカー検出');
      renderer.domElement.remove(); // 一度だけ検出したら停止
    }
  }
  renderLoop();
}

initMarker();
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/ARButton.js';

let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera();
scene.add(camera);

let renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, canvas:document.getElementById('ar-canvas')});
renderer.xr.enabled = true;
document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures:['hit-test'] }));

const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
scene.add(light);

const cube = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.1), new THREE.MeshNormalMaterial());
scene.add(cube);

renderer.setAnimationLoop(() => {
  if(window.detectedMatrix){
    cube.matrixAutoUpdate = false;
    cube.matrix.copy(window.detectedMatrix);
    window.detectedMatrix = null;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
