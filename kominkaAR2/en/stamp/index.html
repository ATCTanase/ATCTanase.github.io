        const remainedWindowInnerHeight = window.innerHeight - stampRallyErea.offsetHeight;

        const stampRallyInHouseMapErea = document.getElementById("stampRallyInHouseMapErea");
        const stampRallyInHouseMapEreaStyle = window.getComputedStyle(stampRallyInHouseMapErea);
      });
    </script>
    <script>
      window.addEventListener("load", function () {
        const backgroundHiddenErea = document.getElementById("backgroundHiddenErea");
        backgroundHiddenErea.setAttribute("style", "height:" + (window.innerHeight + 40) + "px");

        const stampRallyCompleteBackgroud = document.getElementById("stampRallyCompleteBackgroud");
        stampRallyCompleteBackgroud.setAttribute("style", "height:" + (window.innerHeight + 40) + "px");
