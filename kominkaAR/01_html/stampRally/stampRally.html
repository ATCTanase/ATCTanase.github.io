    <script>
      window.addEventListener("load", function () {
        const stampRallyErea = document.getElementById("stampRallyErea");
        const remainedWindowInnerHeight = window.innerHeight - stampRallyErea.offsetHeight;
        // console.log(remainedWindowInnerHeight);

        const stampRallyInHouseMapErea = document.getElementById("stampRallyInHouseMapErea");
        const stampRallyInHouseMapEreaStyle = window.getComputedStyle(stampRallyInHouseMapErea);

        // 館内マップボタンエリアの高さが広いほどpaddingの値は小さくなる
        if(100 >= remainedWindowInnerHeight){
          stampRallyInHouseMapErea.style.paddingLeft  = (1 / remainedWindowInnerHeight) * 1500 + "%";
          stampRallyInHouseMapErea.style.paddingRight = (1 / remainedWindowInnerHeight) * 1500 + "%";
        }
        // console.log("padding-right:", stampRallyInHouseMapEreaStyle.paddingRight);
        // console.log("padding-left: ", stampRallyInHouseMapEreaStyle.paddingLeft);
      });
