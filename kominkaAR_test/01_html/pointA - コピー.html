      let player;
      // API読み込み後に呼ばれる
      function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
          events: {
            "onReady": onPlayerReady
          }
        });
      }

      function onPlayerReady(event) {
        console.log("YouTube Player Ready!");
      }

      // 一時停止用関数
      function pauseVideo() {
        if (player) {
          player.pauseVideo();
        }
      }
